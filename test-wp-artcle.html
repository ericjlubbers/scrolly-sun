<style>
/* ── Scrollytelling: PowerPoint-style fixed-background Cover blocks ─────────
   Each .tight-cover is a transparent scroll-height driver in the normal flow.
   GSAP pulls the .wp-block-cover__image-background divs to position:fixed so
   they always fill the full viewport — like slides behind the scrolling content.
   Only the background opacity is animated; the content (cards, spacers) scrolls
   normally above the fixed images.                                            */

/* Cover blocks: transparent scroll-height containers, no stacking context
   (no z-index, no will-change) so inner-container's z-index participates
   in the root stacking context and paints above the fixed backgrounds.       */
.tight-cover {
  position: relative;
  min-height: 100vh;
}

/* Cards and spacers must paint ABOVE the fixed background layers (z-index 1-N). */
.tight-cover .wp-block-cover__inner-container {
  position: relative;
  z-index: 100;
}

/* Hide WP's dim overlay (dimRatio is 0 on all covers anyway). */
.tight-cover .wp-block-cover__background {
  display: none !important;
}

/* ── Caption card ────────────────────────────────────────────────────────── */
.step-card {
  max-width: 560px !important;
  width: 90% !important;
  margin: 0 auto !important;
  padding: 1.1rem 1.6rem !important;
  font-size: 1rem !important;
  line-height: 1.7 !important;
  text-align: left !important;
  box-shadow: 0 6px 28px rgba(0,0,0,0.22);
  background: rgba(255,255,255,0.93) !important;
}
.step-label {
  display: block;
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
  opacity: 0.55;
}

/* ── Spacers ─────────────────────────────────────────────────────────────── */
/* Top spacer: time before the card enters from the bottom of the viewport. */
.scrolly-spacer-top {
  height: 60vh;
  width: 100%;
  pointer-events: none;
  user-select: none;
}
/* Bottom spacer: dwell time on each image after the card exits before the
   next card arrives. Increase for more breathing room between slides. */
.scrolly-spacer {
  height: 100vh;
  width: 100%;
  pointer-events: none;
  user-select: none;
}

/* ── Mobile fallback ─────────────────────────────────────────────────────── */
/* JS skips the fixed-bg approach on mobile. Reset backgrounds to their
   default block positions and fall back to sticky covers. */
@media (max-width: 768px) {
  .tight-cover .wp-block-cover__image-background {
    position: absolute !important;
    inset: 0 !important;
    background-attachment: scroll !important;
  }
  .tight-cover {
    position: sticky !important;
    top: 0;
    overflow: hidden !important;
  }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/ScrollTrigger.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  gsap.registerPlugin(ScrollTrigger);

  // ── Tunable constants ─────────────────────────────────────────────────────
  // Fires when the previous cover's caption card scrolls off the top.
  // 'bottom 5%'  = fires just before the card fully exits (tiny head start on the fade).
  // 'bottom top' = fires the instant the card bottom crosses the viewport top.
  // 'bottom 10%' = fires earlier for more lead time.
  var CARD_EXIT    = 'bottom 5%';
  var FADE_DURATION = 0.4;  // seconds

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { return; }
  // Skip fixed-bg approach on mobile — CSS sticky fallback handles it.
  if (window.matchMedia('(max-width: 768px)').matches) { return; }

  var covers = gsap.utils.toArray('.tight-cover');

  // ── Pull each background image div to position:fixed ─────────────────────
  // They now permanently fill the full viewport like PowerPoint slides.
  // GSAP z-index stacks them in order; only opacity changes during transitions.
  var bgs = covers.map(function (cover, i) {
    var bg = cover.querySelector('.wp-block-cover__image-background');
    gsap.set(bg, {
      position: 'fixed',
      top: 0, left: 0,
      width: '100%', height: '100%',
      backgroundAttachment: 'scroll', // position:fixed replaces bg-attachment:fixed
      backgroundSize: 'cover',
      zIndex: i + 1,
      opacity: i === 0 ? 1 : 0        // only the first slide is visible on load
    });
    return bg;
  });

  // ── Crossfade triggers ────────────────────────────────────────────────────
  covers.forEach(function (cover, i) {
    if (i === 0) { return; }

    var prevCard = covers[i - 1].querySelector('.step-card');

    ScrollTrigger.create({
      trigger: prevCard,
      start: CARD_EXIT,
      // Incoming slide fades in; outgoing slide fades out simultaneously.
      onEnter: function () {
        gsap.to(bgs[i],     { opacity: 1, duration: FADE_DURATION, ease: 'power1.inOut' });
        gsap.to(bgs[i - 1], { opacity: 0, duration: FADE_DURATION, ease: 'power1.inOut' });
      },
      // Reverse when scrolling back up.
      onLeaveBack: function () {
        gsap.to(bgs[i],     { opacity: 0, duration: FADE_DURATION, ease: 'power1.inOut' });
        gsap.to(bgs[i - 1], { opacity: 1, duration: FADE_DURATION, ease: 'power1.inOut' });
      }
    });
  });

  // ── Exit: fade out last background when the sequence ends ─────────────────
  // Prevents the last image from floating over article content that follows.
  ScrollTrigger.create({
    trigger: covers[covers.length - 1],
    start: 'bottom top',   // last cover's bottom exits the viewport top
    onEnter:     function () { gsap.to(bgs[bgs.length - 1], { opacity: 0, duration: FADE_DURATION, ease: 'power1.inOut' }); },
    onLeaveBack: function () { gsap.to(bgs[bgs.length - 1], { opacity: 1, duration: FADE_DURATION, ease: 'power1.inOut' }); }
  });

});
</script>
